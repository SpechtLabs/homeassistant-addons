name: Pull Request Hygiene

# Squash merges take the PR title as the commit subject, so the title is what
# main's history and Renovate's dependency dashboard show. Titles follow
# Conventional Commits to keep that history readable. Add-on versions are not
# derived from them: each add-on's version is the one in its config.yaml (see
# builder.yaml).
#
# sigil runs a second job here that parses the squash commit with
# release-please's parser. Nothing in this repository releases with
# release-please, so there is nothing for that check to protect.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
      contents: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When the previous step fails the job would stop; always() lets it post
      # the error message as a comment.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Thanks for the pull request! 👋

            Titles here follow [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/),
            because the squash merge makes the title the commit subject on main.
            Use the add-on as the scope, e.g. `fix(grafana_alloy): ...`. An add-on's
            version is the one in its `config.yaml`; bump it there, with a
            `CHANGELOG.md` entry, when its image changes.

            ```text
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      # Delete the previous comment once the title is fixed.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        with:
          header: pr-title-lint-error
          delete: true

  labeler:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
          dot: true
