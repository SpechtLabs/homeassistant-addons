name: Lint

# The Dockerfiles, the s6 service scripts, YAML, Markdown and the workflows
# through `mise run lint`, and every add-on's config.yaml through Home
# Assistant's add-on linter. ci.yaml calls it for pull requests, and it runs on
# its own from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first,
  # pre-commit and pinact included, which it never runs.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.2
  # Every tool `mise run lint` runs. markdownlint-cli2 is an npm package, and
  # mise installs it with the node .mise.toml pins, so node comes first.
  MISE_TOOLS: hadolint yamllint actionlint shellcheck node markdownlint-cli2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      - name: Lint Dockerfiles
        run: mise run docker-lint

      - name: Lint s6 service scripts
        run: mise run shell-lint

      - name: Lint YAML
        run: mise run yaml-lint

      - name: Lint Markdown
        run: mise run md-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

  find:
    name: Find add-ons
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  addon:
    name: Lint add-on ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.find.outputs.addons) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./${{ matrix.path }}"
